<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1118" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Panje">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Panje</title>
<link rel="icon" href="/icon.png">
<style>
@font-face{font-family:"Flags";src:url(/flags.woff2) format("woff2");unicode-range:U+1F1E6-1F1FF,U+1F3F4,U+E0062-E007F}
@font-face{font-family:"Vazirmatn";src:url(/vazirmatn.woff2) format("woff2");font-weight:100 900;font-display:swap}
:root{--bg:#f4f5f8;--card:#fff;--ink:#161a23;--mute:#6b7385;--line:#e4e7ee;--acc:#ea580c;--acc2:#fff0e4;--on:#fff;--ok:#16a34a;--bad:#dc2626;--warn:#d97706;--r:14px;--sh:0 1px 2px rgba(20,24,40,.06),0 4px 14px rgba(20,24,40,.05)}
@media(prefers-color-scheme:dark){:root{--bg:#0e1118;--card:#171b25;--ink:#e8ebf3;--mute:#8b93a7;--line:#262c3a;--acc:#fb923c;--acc2:#3b2412;--on:#1a1006;--sh:0 1px 2px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Flags","Vazirmatn",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:880px;margin:0 auto;padding:0 16px 80px}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:880px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.logo{font-weight:800;font-size:18px;letter-spacing:-.3px;display:flex;align-items:center;gap:8px}
.logo img{height:30px;width:auto;display:block}
.srv .ic.fl{background:none;font-size:26px;font-weight:400}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.on .dot{background:var(--ok);box-shadow:0 0 0 3px #16a34a33}
.btn{border:1px solid var(--line);background:var(--card);padding:7px 14px;border-radius:10px;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--acc)}
.btn.p{background:var(--acc);border-color:var(--acc);color:var(--on);font-weight:600}
.btn.d{color:var(--bad)}
.btn.s{padding:4px 9px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
nav{display:flex;gap:4px;max-width:880px;margin:0 auto;padding:0 12px;overflow-x:auto}
nav button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap}
nav button.a{color:var(--acc);border-color:var(--acc);font-weight:600}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;margin:14px 0;border:1px solid var(--line)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:22px 4px 8px;font-weight:700}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 11px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc2)}
textarea{resize:vertical;min-height:70px;font:13px/1.5 ui-monospace,Menlo,Consolas,"Vazirmatn",monospace}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:0 0 auto}.row>.g{flex:1 1 160px}
.quick{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.quick textarea{flex:1 1 260px;min-height:44px;height:44px}
.quick select{flex:0 0 170px}
.rule{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.rule:last-child{border:0}
.rule.off{opacity:.5}
.rule .m{flex:1;min-width:0;cursor:pointer}
.rule .n{font-weight:600}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.chip{font:12px ui-monospace,Menlo,monospace;background:var(--acc2);color:var(--acc);padding:1px 7px;border-radius:6px}
.tgt{width:auto;max-width:150px;padding:5px 8px;font-size:13px}
.tag-direct{color:var(--ok)}.tag-block{color:var(--bad)}
.sw{position:relative;width:38px;height:22px;flex:0 0 38px}
.sw input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.2s}
.sw span:after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:16px;height:16px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+span{background:var(--acc)}
.sw input:checked+span:after{inset-inline-start:19px}
.dh{touch-action:none;cursor:grab;color:var(--mute);padding:8px 6px;display:flex;user-select:none;-webkit-user-select:none;border-radius:8px}
.dh:hover{color:var(--acc)}.dh.dis{opacity:.25;cursor:not-allowed}
.rule{transition:transform .16s ease;background:var(--card)}
.rule.drag{position:relative;z-index:10;transition:none;box-shadow:0 10px 28px rgba(0,0,0,.28);border-radius:12px;cursor:grabbing;border-color:transparent}
.srch{margin:2px 0 10px}
.quick{align-items:stretch}.quick textarea,.quick select,.quick .btn{height:44px;min-height:44px}
table{width:100%;border-collapse:collapse}
td,th{padding:8px 6px;text-align:start;border-bottom:1px solid var(--line);font-size:14px}
th{color:var(--mute);font-weight:600;font-size:12px}
tr:last-child td{border:0}
.ping{font-variant-numeric:tabular-nums}
.good{color:var(--ok)}.mid{color:var(--warn)}.bad{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label{display:block;font-size:12px;color:var(--mute);margin-bottom:3px}
.pick{max-height:170px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--bg)}
.pick label{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px;margin:0;padding:3px 0}
.pick input{width:auto}
.empty{color:var(--mute);text-align:center;padding:24px}
pre{background:#0b0e14;color:#c9d1e4;padding:12px;border-radius:12px;overflow:auto;max-height:60vh;font-size:12px;margin:0}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:90vw}
#toast.s{opacity:1}#toast.e{background:var(--bad);color:#fff}
.login{max-width:340px;margin:18vh auto;text-align:center}
.login .logo{justify-content:center;font-size:26px;margin-bottom:18px}
.err{background:#dc262615;border:1px solid #dc262655;color:var(--bad);padding:8px 12px;border-radius:10px;margin:12px 0;font-size:13px;white-space:pre-wrap}
small{color:var(--mute)}

.hero{display:flex;flex-direction:column;align-items:center;padding:30px 0 10px}
.pw{width:156px;height:156px;border-radius:50%;border:0;cursor:pointer;position:relative;background:linear-gradient(145deg,var(--card),var(--bg));box-shadow:0 10px 30px rgba(0,0,0,.18),inset 0 0 0 2px var(--line);color:var(--mute);display:grid;place-items:center;transition:.3s}
.pw svg{width:64px;height:64px}
.pw.on{background:linear-gradient(145deg,#fb923c,#ea580c);color:#fff;box-shadow:0 0 0 10px #ea580c22,0 0 0 22px #ea580c11,0 14px 40px #ea580c66}
.pw.busy{cursor:progress}
.pw.busy svg{opacity:.45;transform:scale(.9);transition:.3s}
.pw.busy::before{content:"";position:absolute;inset:-9px;border-radius:50%;padding:5px;background:conic-gradient(from 0deg,transparent 0 25%,#fb923c 70%,#ea580c);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#bar{position:fixed;top:0;inset-inline:0;height:3px;z-index:30;overflow:hidden;opacity:0;transition:opacity .2s;pointer-events:none}
#bar i{position:absolute;top:0;bottom:0;width:40%;background:linear-gradient(90deg,transparent,#fb923c,#ea580c,transparent);animation:slide 1.1s ease-in-out infinite}
body.loading #bar{opacity:1}
@keyframes slide{from{left:-40%}to{left:100%}}
.btn:disabled{position:relative}
.btn:disabled::after{content:"";display:inline-block;width:11px;height:11px;margin-inline-start:8px;vertical-align:-1px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
.st{font-size:22px;font-weight:700;margin-top:26px}
.st.on{color:var(--acc)}
.up{color:var(--mute);font-variant-numeric:tabular-nums;direction:ltr;min-height:22px}
.sum{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0 4px}
.sum .pill{cursor:pointer}
.sec{display:flex;align-items:center;margin:22px 4px 8px;gap:8px}
.sec h3{margin:0;font-size:16px;flex:1}
.ib{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;display:grid;place-items:center;font-size:17px;color:var(--ink)}
.ib:hover{border-color:var(--acc);color:var(--acc)}
.srv{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:8px;cursor:pointer;transition:.15s}
.srv.sel{border-color:var(--acc);background:var(--acc2)}
.srv .ic{width:38px;height:38px;border-radius:12px;background:var(--acc2);color:var(--acc);display:grid;place-items:center;font-weight:800;flex:0 0 38px}
.srv .nm{flex:1;min-width:0}.srv .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srv .x{opacity:.35;border:0;background:none;cursor:pointer;color:var(--ink);padding:4px 8px}.srv .x:hover{opacity:1;color:var(--bad)}
.chipbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.chipbar button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 12px;cursor:pointer;white-space:nowrap;font-size:13px}
.chipbar button.a{background:var(--acc);border-color:var(--acc);color:var(--on)}
.menu a{display:flex;align-items:center;gap:14px;padding:15px 16px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:8px;cursor:pointer;font-weight:600}
.menu a span{font-size:20px;width:26px;text-align:center}
.menu a:after{content:"›";margin-inline-start:auto;color:var(--mute);font-size:20px}
[dir=rtl] .menu a:after{content:"‹"}
.ttl{font-weight:700;font-size:17px}

*{-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button,.pw,.srv,.chipbar button,.menu a{touch-action:manipulation}
header{padding-top:env(safe-area-inset-top)}
.wrap{padding-bottom:calc(80px + env(safe-area-inset-bottom))}
.chip{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rule .m{overflow:hidden}
@media(max-width:700px){.quick textarea{flex:1 1 100%;height:68px;min-height:68px}.quick select{flex:1 1 0;min-width:0}.tgt{max-width:98px}
input,select,textarea{font-size:16px}.bar,.wrap{padding-inline:14px}.hero{padding-top:18px}}
#toast{bottom:calc(20px + env(safe-area-inset-bottom))}
@media(display-mode:standalone){body{user-select:none;-webkit-user-select:none}input,textarea{user-select:text;-webkit-user-select:text}}
</style>
</head>

<script>
const I={
en:{rules:"Rules",nodes:"Subscriptions",groups:"Groups",settings:"Settings",logs:"Logs",start:"Start",stop:"Stop",running:"Running",stopped:"Stopped",

quick:"دامنه، IP یا geosite:/geoip: — هر خط یک مورد",add:"افزودن قانون",direct:"مستقیم",block:"مسدود",rest:"بقیه ترافیک",
sub:"اشتراک‌ها (Subscription)",subname:"نام",suburl:"آدرس اشتراک",hours:"به‌روزرسانی خودکار (ساعت)",update:"به‌روزرسانی",del:"حذف",import:"افزودن لینک",
importph:"لینک‌های vmess:// vless:// trojan:// ss:// یا کل اشتراک را اینجا بچسبانید",test:"تست پینگ",name:"نام",proto:"نوع",addr:"آدرس",ping:"پینگ",
strategy:"روش انتخاب",single:"تکی (اولی)",roundRobin:"چرخشی",random:"تصادفی",leastPing:"کمترین پینگ",newgroup:"گروه جدید",members:"اعضا",
save:"ذخیره",lang:"English",pass:"رمز جدید",setpass:"تغییر رمز",login:"ورود",password:"رمز عبور",
transparent:"پروکسی شفاف برای شبکه LAN",lan:"اینترفیس LAN",allowlan:"اجازه SOCKS/HTTP به شبکه محلی",panel:"آدرس و پورت پنل",

search:"جستجو در قوانین…",nodrag:"برای جابه‌جایی فیلتر را بردارید",addb:"افزودن",connected:"متصل شد",connecting:"در حال اتصال…",disconnecting:"در حال قطع…",disconnected:"متصل نیستید",tapon:"برای اتصال لمس کنید",auto:"خودکار",autosub:"بهترین سرور بر اساس پینگ",menu:"منو",allsrv:"همه",addsrv:"افزودن اشتراک / لینک",pingall:"تست همه",route:"مسیریابی",selected:"سرور انتخاب‌شده",dat:"فایل‌های geo / قوانین (.dat)",upload:"آپلود .dat",dathint:"geoip.dat / geosite.dat یا لیست دلخواه را آپلود کنید؛ در قانون‌ها به شکل ext:name.dat:tag استفاده می‌شود",nodat:"فایلی نیست",hint:"مثال: netflix.com ، geosite:google ، 8.8.8.0/24 ، port:22",wholesub:"کل اشتراک",never:"هرگز",srvs:"سرور"}};
let L=localStorage.lang||((navigator.language||"").startsWith("fa")?"fa":"en"),S=null,tab="home",flt="",busy=false,editing=null,logs=[],needLogin=false;
const t=k=>I[L][k]||k,$=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(m,e){const x=$("#toast");x.textContent=m;x.className="s"+(e?" e":"");clearTimeout(x.t);x.t=setTimeout(()=>x.className="",e?5000:1800)}
let pend=0;const lod=d=>{pend+=d;document.body.classList.toggle("loading",pend>0)};
async function api(m,p,b,quiet){
 lod(1);try{return await api0(m,p,b,quiet)}finally{lod(-1)}}
async function api0(m,p,b,quiet){
 const r=await fetch("/api/"+p,{method:m,headers:{"Content-Type":"application/json"},body:b===undefined?undefined:JSON.stringify(b)});
 if(r.status===401){needLogin=true;render();return null}
 const j=await r.json();
 if(j.data){S=j;needLogin=false}
 if(j.error&&!quiet){toast(j.error,1)}
 render();return j}
const tgtName=id=>id=="direct"?t("direct"):id=="block"?t("block"):(S.data.groups.find(g=>g.id==id)||{name:"?"}).name;
const tgtOpts=sel=>["direct","block",...S.data.groups.map(g=>g.id)].map(id=>`<option value="${esc(id)}"${id==sel?" selected":""}>${esc(tgtName(id))}</option>`).join("");

function render(){
 document.documentElement.lang=L;document.documentElement.dir=L=="fa"?"rtl":"ltr";
 const a=$("#app");
 if(needLogin||!S){a.innerHTML=`<form class="login card" onsubmit="return login(event)" style="text-align:center"><img src="/logo.png" alt="Panje" style="height:170px;margin-bottom:18px"><br>
  <input id="pw" type="password" placeholder="${t("password")}" autofocus><br><br><button class="btn p" style="width:100%">${t("login")}</button></form>`;return}
 const st=S.status,home=tab=="home";
 const head=home?`<div class="logo"><img src="/icon.png" alt=""><span>Panje</span></div><div class="sp"></div><button class="ib" onclick="go('menu')" aria-label="menu">☰</button>`
  :`<button class="ib" onclick="go(tab=='menu'?'home':'menu')" aria-label="back">${L=="fa"?"→":"←"}</button><div class="ttl">${t(tab=="menu"?"menu":tab)}</div><div class="sp"></div>${tab=="menu"?"":`<span class="pill ${st.running?"on":""}"><span class="dot"></span>${st.running?t("running"):t("stopped")}</span>`}`;
 a.innerHTML=`<header><div class="bar">${head}</div></header>
  <div class="wrap">${st.err?`<div class="err">${esc(st.err)}</div>`:""}${{home:vHome,menu:vMenu,rules:vRules,nodes:vNodes,groups:vGroups,settings:vSettings,logs:vLogs}[tab]()}</div>`;if(tab=="rules")rlRender()}

/* ---- home ---- */
const mainGroup=()=>{const d=S.data;return d.groups.find(g=>g.id==d.settings.default)||d.groups[0]};
const isAuto=g=>!g||!(g.strategy=="single"&&(g.nodes||[]).length==1&&!(g.subs||[]).length);
function upStr(){const s=S.status;if(!s.running)return "";let x=Math.max(0,Math.floor(Date.now()/1000-s.since)),h=Math.floor(x/3600),m=Math.floor(x%3600/60);x%=60;return [h,m,x].map(v=>String(v).padStart(2,"0")).join(":")}
setInterval(()=>{const e=$("#up");if(e)e.textContent=upStr()},1000);
const FLAG=/^\s*([\u{1F1E6}-\u{1F1FF}]{2})\s*/u;
function nodeIc(n){const m=n.name.match(FLAG);return m?[`<div class="ic fl">${m[1]}</div>`,n.name.replace(FLAG,"")||n.addr]:[`<div class="ic">${esc((n.proto||"?")[0].toUpperCase())}</div>`,n.name]}
function vHome(){const d=S.data,st=S.status,g=mainGroup(),auto=isAuto(g);
 let nodes=d.nodes.filter(n=>!flt||(flt=="_"?!n.sub:n.sub==flt));
 const ping=n=>n.ping?`<span class="ping ${n.ping<0?"bad":n.ping<300?"good":"mid"}">${n.ping<0?"✕":n.ping+" ms"}</span>`:"";
 return `<div class="hero"><button class="pw ${st.running?"on":""} ${busy?"busy":""}" onclick="toggle()" aria-label="power"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v9"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg></button>
  <div class="st ${st.running&&!busy?"on":""}">${busy?t(st.running?"disconnecting":"connecting"):st.running?t("connected"):t("disconnected")}</div><div class="up" id="up">${busy?"":st.running?upStr():t("tapon")}</div></div>
  <div class="sum"><span class="pill" onclick="go('rules')">⇄ ${t("route")}: ${d.rules.filter(r=>r.enabled).length}</span><span class="pill" onclick="go('groups')">◉ ${esc(g?g.name:"-")} · ${t(g?g.strategy:"single")}</span></div>
  <div class="sec"><h3>${t("srvs")} (${d.nodes.length})</h3><button class="ib" title="${t("pingall")}" onclick="pingAll(this)">⚡</button><button class="ib" title="${t("addsrv")}" onclick="go('nodes')">＋</button></div>
  ${d.subs.length?`<div class="chipbar"><button class="${!flt?"a":""}" onclick="flt='';render()">${t("allsrv")}</button>${d.subs.map(s=>`<button class="${flt==s.id?"a":""}" onclick="flt='${s.id}';render()">${esc(s.name)}</button>`).join("")}</div>`:""}
  <div class="srv ${auto?"sel":""}" onclick="selAuto()"><div class="ic">⚡</div><div class="nm"><b>${t("auto")}</b><small>${t("autosub")}</small></div>${auto?"✓":""}</div>
  ${nodes.length?nodes.map(n=>{const sel=!auto&&g.nodes[0]==n.id;const [ic,nm]=nodeIc(n);return `<div class="srv ${sel?"sel":""}" onclick="selNode('${n.id}')">${ic}
  <div class="nm"><b>${esc(nm)}</b><small dir="ltr">${n.proto} · ${esc(n.addr)}</small></div>${ping(n)}${sel?"✓":""}<button class="x" onclick="event.stopPropagation();api('DELETE','nodes/${n.id}')">✕</button></div>`}).join(""):`<div class="empty">${t("nonodes")}<br><br><button class="btn p" onclick="go('nodes')">${t("addsrv")}</button></div>`}`}
function setMain(fn){const gs=structuredClone(S.data.groups),g=gs.find(x=>x.id==S.data.settings.default)||gs[0];if(!g)return;fn(g);return saveGroups(gs)}
const selAuto=()=>setMain(g=>{g.strategy="leastPing";g.subs=S.data.subs.map(s=>s.id);g.nodes=S.data.nodes.filter(n=>!n.sub).map(n=>n.id)});
const selNode=id=>setMain(g=>{g.strategy="single";g.nodes=[id];g.subs=[]});
function vMenu(){const it=[["rules","⇄"],["groups","◉"],["nodes","☁"],["settings","⚙"],["logs","≣"]];
 return `<div class="menu" style="margin-top:14px">${it.map(([k,i])=>`<a onclick="go('${k}')"><span>${i}</span>${t(k)}</a>`).join("")}<a onclick="setLang()"><span>🌐</span>${t("lang")}</a><a onclick="out()"><span>⎋</span>${t("logout")}</a></div>`}

function go(k){tab=k;editing=null;if(k=="logs")loadLogs();if(k=="settings")loadDats();render()}
async function login(e){e.preventDefault();const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("#pw").value})});
 if(!r.ok){toast((await r.json()).error,1);return false}await api("GET","state");return false}
async function toggle(){if(busy)return;busy=true;render();
 const g=mainGroup();if(!S.status.running&&g&&!(g.nodes||[]).length&&!(g.subs||[]).length&&S.data.nodes.length)await selAuto();await api("POST",S.status.running?"stop":"apply",{});busy=false;render()}

/* ---- rules ---- */
let rf="",rq="",drag=null;
function vRules(){const d=S.data;
 return `<div class="card"><div class="quick"><textarea id="qm" placeholder="${t("quick")}" onkeydown="if(event.key=='Enter'&&(event.ctrlKey||event.metaKey))quickAdd()"></textarea>
 <select id="qt">${tgtOpts(d.groups[0]?.id)}</select><button class="btn p" onclick="quickAdd()">${t("add")}</button></div><small>${t("hint")}</small></div>
 <input class="srch" id="rs" type="search" placeholder="${t("search")}" value="${esc(rq)}" oninput="rq=this.value;rlRender()">
 <div class="chipbar" id="rc"></div>
 <div class="card" style="padding:4px 4px"><div id="rl"></div>
 <div class="rule"><div class="m"><span class="n">${t("rest")}</span></div><select class="tgt" onchange="setDefault(this.value)">${tgtOpts(d.settings.default)}</select></div></div>`}
function rlRender(){const d=S.data,cnt={};d.rules.forEach(r=>cnt[r.target]=(cnt[r.target]||0)+1);
 const tg=["direct","block",...d.groups.map(g=>g.id)].filter(x=>cnt[x]);
 if(rf&&!cnt[rf])rf="";
 $("#rc").innerHTML=`<button class="${!rf?"a":""}" onclick="rf='';rlRender()">${t("allsrv")} · ${d.rules.length}</button>`+tg.map(x=>`<button class="${rf==x?"a":""}" onclick="rf='${x}';rlRender()">${esc(tgtName(x))} · ${cnt[x]}</button>`).join("");
 const q=rq.trim().toLowerCase(),can=!rf&&!q;
 const rows=d.rules.map((r,i)=>[r,i]).filter(([r])=>(!rf||r.target==rf)&&(!q||(r.name+" "+r.match).toLowerCase().includes(q)));
 $("#rl").innerHTML=rows.length?rows.map(([r,i])=>ruleRow(r,i,can)).join(""):`<div class="empty">${t("empty")}</div>`}
function ruleRow(r,i,can){const ents=r.match.split(/[\s,]+/).filter(Boolean);
 if(editing===r.id)return `<div class="rule" style="flex-wrap:wrap"><input class="g" id="en" value="${esc(r.name)}" placeholder="${t("name")}"><textarea id="em" style="flex:1 1 100%">${esc(r.match)}</textarea>
  <button class="btn p s" onclick="saveEdit(${i})">${t("save")}</button><button class="btn s" onclick="editing=null;rlRender()">✕</button></div>`;
 return `<div class="rule ${r.enabled?"":"off"}" data-i="${i}"><div class="dh ${can?"":"dis"}" ${can?`onpointerdown="dragStart(event,${i})"`:`title="${t("nodrag")}"`}><svg width="14" height="20" viewBox="0 0 14 20" fill="currentColor"><circle cx="4" cy="4" r="1.8"/><circle cx="10" cy="4" r="1.8"/><circle cx="4" cy="10" r="1.8"/><circle cx="10" cy="10" r="1.8"/><circle cx="4" cy="16" r="1.8"/><circle cx="10" cy="16" r="1.8"/></svg></div>
 <label class="sw"><input type="checkbox" ${r.enabled?"checked":""} onchange="upd(${i},{enabled:this.checked})"><span></span></label>
 <div class="m" onclick="editing='${r.id}';rlRender()"><div class="n">${esc(r.name)}</div><div class="chips">${ents.slice(0,5).map(e=>`<span class="chip">${esc(e)}</span>`).join("")}${ents.length>5?`<small>+${ents.length-5}</small>`:""}</div></div>
 <select class="tgt tag-${r.target}" onchange="upd(${i},{target:this.value})">${tgtOpts(r.target)}</select>
 <button class="btn d s" onclick="delRule(${i})">✕</button></div>`}
const saveRules=r=>api("PUT","rules",r);
function upd(i,p){const r=structuredClone(S.data.rules);Object.assign(r[i],p);saveRules(r)}
function delRule(i){const r=structuredClone(S.data.rules);r.splice(i,1);saveRules(r)}
function saveEdit(i){editing=null;upd(i,{name:$("#en").value,match:$("#em").value})}
async function quickAdd(){const m=$("#qm").value.trim();if(!m)return;const j=await api("POST","rules/quick",{match:m,target:$("#qt").value});if(j&&!j.error){toast(t("saved"))}}
function setDefault(v){const s={...S.data.settings,default:v};api("PUT","settings",s)}

/* drag & drop reorder: pointer events so it works with mouse and touch */
function dragStart(e,i){
 if(e.button>0)return;e.preventDefault();
 const row=e.currentTarget.closest(".rule"),rows=[...$("#rl").querySelectorAll(".rule[data-i]")];
 const rects=rows.map(r=>{const b=r.getBoundingClientRect();return{top:b.top+scrollY,h:b.height}});
 drag={i,row,rows,rects,y0:e.clientY+scrollY,cy:e.clientY,to:i,id:e.pointerId,h:rects[i].h};
 row.classList.add("drag");e.currentTarget.setPointerCapture(e.pointerId);
 addEventListener("pointermove",dragMove);addEventListener("pointerup",dragEnd);addEventListener("pointercancel",dragEnd);
 drag.raf=requestAnimationFrame(dragTick)}
function dragMove(e){if(drag&&e.pointerId==drag.id){drag.cy=e.clientY;dragUpdate()}}
function dragTick(){if(!drag)return;const y=drag.cy;
 if(y<90)scrollBy(0,-Math.ceil((90-y)/6));else if(y>innerHeight-90)scrollBy(0,Math.ceil((y-(innerHeight-90))/6));
 dragUpdate();drag.raf=requestAnimationFrame(dragTick)}
function dragUpdate(){const D=drag,py=D.cy+scrollY,dy=py-D.y0;
 D.row.style.transform=`translateY(${dy}px)`;
 const c=D.rects[D.i].top+D.h/2+dy;let to=D.i;
 D.rects.forEach((r,j)=>{if(c>=r.top&&c<r.top+r.h)to=j});
 if(c<D.rects[0].top)to=0;if(c>=D.rects.at(-1).top+D.rects.at(-1).h)to=D.rects.length-1;
 D.to=to;
 D.rows.forEach((r,j)=>{if(j==D.i)return;r.style.transform=D.i<to&&j>D.i&&j<=to?`translateY(${-D.h}px)`:D.i>to&&j>=to&&j<D.i?`translateY(${D.h}px)`:""})}
function dragEnd(e){if(!drag||e.pointerId!=drag.id)return;
 removeEventListener("pointermove",dragMove);removeEventListener("pointerup",dragEnd);removeEventListener("pointercancel",dragEnd);
 cancelAnimationFrame(drag.raf);const {i,to}=drag;drag=null;
 if(e.type=="pointerup"&&to!=i){const r=structuredClone(S.data.rules),[x]=r.splice(i,1);r.splice(to,0,x);saveRules(r)}else rlRender()}

/* ---- nodes ---- */
function vNodes(){const d=S.data;
 return `<h2>${t("sub")}</h2><div class="card"><div class="row"><input class="g" id="sn" placeholder="${t("subname")}"><input class="g" style="flex-basis:260px" id="su" placeholder="${t("suburl")}" dir="ltr">
 <input id="sh" type="number" min="0" value="12" style="width:90px" title="${t("hours")}"><button class="btn p" onclick="addSub()">${t("addb")}</button></div>
 ${d.subs.length?`<table>${d.subs.map(s=>`<tr><td><b>${esc(s.name)}</b><br><small dir="ltr">${s.updated?new Date(s.updated*1000).toLocaleString():t("never")} · ${s.count} ${t("srvs")}</small>${s.lastErr?`<br><small class="bad">${esc(s.lastErr)}</small>`:""}</td>
 <td style="text-align:end;white-space:nowrap"><button class="btn s" onclick="subUp('${s.id}',this)">${t("update")}</button> <button class="btn d s" onclick="api('DELETE','subs/${s.id}')">✕</button></td></tr>`).join("")}</table>`:`<div class="empty">${t("nosubs")}</div>`}</div>
 <h2>${t("import")}</h2><div class="card"><textarea id="imp" dir="ltr" placeholder="${t("importph")}"></textarea><div style="margin-top:8px"><button class="btn p" onclick="imp()">${t("import")}</button></div></div>`}
async function addSub(){const u=$("#su").value.trim();if(!u)return;toast("…");await api("POST","subs",{name:$("#sn").value,url:u,hours:+$("#sh").value})}
async function subUp(id,b){b.disabled=true;toast("…");await api("POST",`subs/${id}/update`,{})}
async function imp(){const x=$("#imp").value;if(!x.trim())return;const j=await api("POST","nodes/import",{text:x});if(j&&!j.error)toast(t("saved"))}
async function pingAll(b){b.disabled=true;toast("…");await api("POST","nodes/ping",{})}

/* ---- groups ---- */
function vGroups(){const d=S.data;
 return d.groups.map((g,i)=>`<div class="card"><div class="row"><input class="g" value="${esc(g.name)}" onchange="gset(${i},'name',this.value)">
 <select style="width:auto" onchange="gset(${i},'strategy',this.value)">${["single","roundRobin","random","leastPing"].map(s=>`<option value="${s}"${g.strategy==s?" selected":""}>${t(s)}</option>`).join("")}</select>
 <button class="btn d s" onclick="gdel(${i})">✕</button></div>
 <div class="pick" style="margin-top:10px">${d.subs.map(s=>`<label><input type="checkbox" ${(g.subs||[]).includes(s.id)?"checked":""} onchange="gtog(${i},'subs','${s.id}',this.checked)"><b>${esc(s.name)}</b> <small>(${t("wholesub")})</small></label>`).join("")}
 ${d.nodes.filter(n=>!n.sub).map(n=>`<label><input type="checkbox" ${(g.nodes||[]).includes(n.id)?"checked":""} onchange="gtog(${i},'nodes','${n.id}',this.checked)">${esc(n.name)}</label>`).join("")}
 ${d.nodes.filter(n=>n.sub).map(n=>`<label><input type="checkbox" ${(g.nodes||[]).includes(n.id)?"checked":""} onchange="gtog(${i},'nodes','${n.id}',this.checked)">${esc(n.name)}</label>`).join("")}
 ${!d.nodes.length?`<div class="empty">${t("nonodes")}</div>`:""}</div></div>`).join("")+
 `<button class="btn" onclick="gadd()">＋ ${t("newgroup")}</button>`}
const saveGroups=g=>api("PUT","groups",g);
function gset(i,k,v){const g=structuredClone(S.data.groups);g[i][k]=v;saveGroups(g)}
function gtog(i,k,id,on){const g=structuredClone(S.data.groups);let a=g[i][k]||[];a=a.filter(x=>x!=id);if(on)a.push(id);g[i][k]=a;saveGroups(g)}
function gdel(i){const g=structuredClone(S.data.groups);g.splice(i,1);saveGroups(g)}
function gadd(){const g=structuredClone(S.data.groups);g.push({id:"",name:t("newgroup"),strategy:"roundRobin",nodes:[],subs:[]});saveGroups(g)}

/* ---- settings ---- */
function vSettings(){const s=S.data.settings,f=(k,l,ty)=>`<div><label>${l}</label><input data-k="${k}" ${ty=="n"?'type="number"':""} value="${esc(s[k])}" dir="ltr"></div>`,
 c=(k,l)=>`<label style="display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px"><input type="checkbox" style="width:auto" data-k="${k}" ${s[k]?"checked":""}>${l}</label>`;
 return `<div class="card"><div class="grid">${f("listen",t("panel"))}${f("lanIface",t("lan"))}${f("dns",t("dns"))}${f("localDns",t("ldns"))}
 ${f("tproxyPort","TPROXY port","n")}${f("socksPort","SOCKS port","n")}${f("httpPort","HTTP port","n")}${f("assetDir","geo dir")}
 <div><label>xray (external, optional)</label><input data-k="xrayBin" value="${esc(s.xrayBin)}" dir="ltr" placeholder="built-in"></div><div><label>Log</label><select data-k="logLevel">${["debug","info","warning","error","none"].map(x=>`<option${s.logLevel==x?" selected":""}>${x}</option>`).join("")}</select></div></div>
 <div style="margin-top:12px;display:grid;gap:8px">${c("transparent",t("transparent"))}${c("allowLan",t("allowlan"))}${c("autoStart","Auto start")}</div>
 <div class="row" style="margin-top:14px"><button class="btn p" onclick="saveSettings()">${t("save")}</button><small>${t("restart")}</small></div></div>
 <h2>${t("dat")}</h2><div class="card"><small>${t("dathint")}</small>
 ${dats.length?`<table>${dats.map(f=>`<tr><td dir="ltr"><b>${esc(f.name)}</b></td><td><small>${(f.size/1048576).toFixed(1)} MB</small></td><td style="text-align:end"><button class="btn d s" onclick="datDel('${esc(f.name)}')">✕</button></td></tr>`).join("")}</table>`:`<div class="empty">${t("nodat")}</div>`}
 <div class="row" style="margin-top:10px"><button class="btn" onclick="geo(this)">${t("geo")}</button><button class="btn p" onclick="this.nextElementSibling.click()">${t("upload")}</button><input type="file" accept=".dat" multiple hidden onchange="datUp(this)"></div></div>
 <div class="card"><div class="row"><input class="g" id="np" type="password" placeholder="${t("pass")}"><button class="btn" onclick="setPass()">${t("setpass")}</button>
 <button class="btn" onclick="setLang()">${t("lang")}</button><button class="btn d" onclick="out()">${t("logout")}</button></div></div>`}
async function saveSettings(){const s={...S.data.settings};document.querySelectorAll("[data-k]").forEach(e=>{const k=e.dataset.k;s[k]=e.type=="checkbox"?e.checked:e.type=="number"?+e.value:e.value});
 const j=await api("PUT","settings",s);if(j&&!j.error)toast(t("saved"))}
let dats=[];
async function loadDats(){const r=await fetch("/api/dat");if(r.ok){dats=await r.json();if(tab=="settings")render()}}
async function datUp(i){lod(1);try{for(const f of i.files){toast("… "+f.name);const r=await fetch("/api/dat/"+encodeURIComponent(f.name),{method:"POST",headers:{"X-Panje":"1"},body:f});const j=await r.json();if(j.error)toast(j.error,1);else{if(j.data)S=j;toast(t("saved"))}}}finally{lod(-1)}loadDats()}
async function datDel(n){await fetch("/api/dat/"+encodeURIComponent(n),{method:"DELETE",headers:{"X-Panje":"1"}});loadDats()}
async function geo(b){b.disabled=true;toast("…");const j=await api("POST","geo",{});if(j&&!j.error)toast(t("saved"));loadDats()}
async function setPass(){const p=$("#np").value;const r=await fetch("/api/password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:p})});
 if(!r.ok)return toast((await r.json()).error,1);needLogin=true;render()}
function setLang(){L=L=="fa"?"en":"fa";localStorage.lang=L;render()}
async function out(){await api("POST","logout",{},1);needLogin=true;render()}

/* ---- logs ---- */
function vLogs(){return `<pre dir="ltr">${esc(logs.join("\n"))||"…"}</pre>`}
async function loadLogs(){const r=await fetch("/api/logs");if(r.ok){logs=await r.json();if(tab=="logs")render()}}
setInterval(()=>{if(S&&!needLogin&&document.visibilityState=="visible"&&!drag&&!document.activeElement?.matches("input,textarea,select")){if(tab=="logs")loadLogs();else api("GET","state",undefined,1)}},5000);
api("GET","state",undefined,1);
if("serviceWorker" in navigator&&isSecureContext)navigator.serviceWorker.register("/sw.js").catch(()=>{});
</script>
